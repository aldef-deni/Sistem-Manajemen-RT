name: Deploy ke rt.aldeftech.com

on:
  push:
    branches: [main]
  workflow_dispatch:        # tombol "Run workflow" untuk deploy manual

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build aset + deploy ke server
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      # Aset dibangun di sini, bukan di VPS — server tidak perlu Node.js
      # dan tidak kehabisan RAM saat build.
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependency front-end
        run: npm ci --no-audit --no-fund

      - name: Build aset Vite
        run: npm run build

      - name: Kirim public/build ke server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SSH_HOST }}
          port:     ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          source:   "public/build/**"
          target:   ${{ secrets.APP_DIR }}
          overwrite: true

      - name: Jalankan deploy.sh di server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SSH_HOST }}
          port:     ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            cd ${{ secrets.APP_DIR }}
            BUILD_ASSETS=0 bash deploy.sh

      - name: Ringkasan
        if: success()
        run: |
          echo "Deploy \`${GITHUB_SHA:0:7}\` berhasil → https://rt.aldeftech.com" >> $GITHUB_STEP_SUMMARY
